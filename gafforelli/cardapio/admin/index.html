<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerenciamento Gafforelli</title>
<style>
html,body{
  margin:0;
  min-height:100%;
  background:#060606;
  color:#fff;
  font-family:Arial,sans-serif;
}
body{
  display:grid;
  place-items:center;
}
#loading{
  font-size:13px;
  color:#aaa;
}
</style>
</head>
<body>

<div id="loading">Carregando gerenciamento...</div>

<script>
fetch(
  "https://etgzagkewmsxxerwelmp.supabase.co/storage/v1/object/public/gafforelli-app/admin-v2.html?v=2",
  { cache: "no-store" }
)
.then(function(r){
  if(!r.ok) throw new Error("Erro " + r.status);
  return r.text();
})
.then(function(html){
  document.open();
  document.write(html);
  document.close();
})
.catch(function(err){
  document.getElementById("loading").textContent =
    "Não foi possível carregar o painel: " + err.message;
});
</script>

</body>
</html>
