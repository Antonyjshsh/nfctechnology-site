<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NFC Cardápios — Máfia do Sushi</title>
<meta name="theme-color" content="#111111" />
<style>
:root{--bg:#101112;--panel:#17191c;--panel2:#1d2024;--line:rgba(255,255,255,.08);--text:#fff;--muted:#b8bbc3;--primary:#ff2d2d;--gold:#ffd54a;--max:480px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#0c0d0e;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
.app{width:min(100%,var(--max));margin:0 auto;min-height:100vh;background:linear-gradient(180deg,#121314,#0e0f10);padding-bottom:88px;box-shadow:0 0 0 1px rgba(255,255,255,.03)}
.top{position:sticky;top:0;z-index:30;padding:14px 14px 10px;background:rgba(15,16,17,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.search{display:flex;gap:10px;align-items:center}.searchbox{flex:1;height:48px;border-radius:999px;border:1px solid var(--line);background:#1a1c1f;padding:0 16px;display:flex;align-items:center;gap:10px;color:var(--muted)}.searchbox input{all:unset;flex:1;color:#fff;font-size:14px}.round{width:48px;height:48px;border:none;border-radius:50%;background:var(--primary);color:#fff;font-size:18px;font-weight:900;box-shadow:0 10px 24px rgba(255,45,45,.25)}
.hero{display:flex;gap:14px;padding:18px 16px 14px;align-items:flex-start}.logo{width:92px;height:92px;border-radius:50%;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.08);flex:0 0 92px;box-shadow:0 12px 26px rgba(0,0,0,.3)}.logo img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:12px;color:#ffc4c4;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.title{font-size:31px;line-height:1.02;margin:4px 0 6px;font-weight:950}.status{font-size:14px;color:#fff;font-weight:800;margin-bottom:10px}.badge{display:inline-flex;align-items:center;gap:7px;background:#26292e;border:1px solid rgba(255,255,255,.06);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800}
.tabswrap{position:sticky;top:73px;z-index:20;background:rgba(23,25,28,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}.tabs{display:flex;gap:8px;overflow:auto;padding:0 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;padding:10px 13px;border-radius:999px;border:1px solid transparent;color:var(--muted);font-size:13px;font-weight:900}.tab.active{background:rgba(255,45,45,.14);border-color:rgba(255,45,45,.25);color:#fff}
main{padding:18px 16px 0}.section{margin-bottom:28px;scroll-margin-top:142px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.head h2{margin:0;font-size:23px}.head small{color:var(--muted);font-weight:700}
.highlights{display:grid;grid-auto-flow:column;grid-auto-columns:44%;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.highlights::-webkit-scrollbar{display:none}.hcard{background:var(--panel);border:1px solid var(--line);border-radius:19px;overflow:hidden;position:relative;box-shadow:0 14px 28px rgba(0,0,0,.22)}.hcard img{width:100%;aspect-ratio:1/1.12;object-fit:cover}.rank{position:absolute;top:10px;right:10px;width:50px;height:50px;border-radius:50%;background:var(--primary);display:grid;place-items:center;font-weight:950;font-size:19px}.hcopy{padding:11px}.hname{font-size:14px;font-weight:900;line-height:1.25;margin-bottom:8px}.price{font-weight:950;font-size:17px}
.list{display:flex;flex-direction:column;gap:14px}.item{display:flex;gap:13px;padding:0 0 14px;border-bottom:1px solid var(--line);cursor:pointer}.item:last-child{border-bottom:none}.thumb{width:118px;height:108px;flex:0 0 118px;border-radius:16px;overflow:hidden;background:#0a0b0c;border:1px solid rgba(255,255,255,.05)}.thumb img{width:100%;height:100%;object-fit:cover}.icopy{flex:1;min-width:0}.iname{font-size:17px;line-height:1.2;font-weight:900;margin-bottom:7px}.idesc{font-size:13px;line-height:1.42;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}.meta{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}.rating{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:6px 8px;background:#1c1f23;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:800}.rating span{color:var(--gold)}.view{font-size:12px;font-weight:900;color:#fff;background:rgba(255,45,45,.13);border:1px solid rgba(255,45,45,.22);padding:8px 10px;border-radius:999px}
.cta{margin:8px 0 26px;padding:18px;border-radius:22px;background:linear-gradient(180deg,#191b1e,#141517);border:1px solid var(--line)}.cta h3{margin:0 0 8px;font-size:21px}.cta p{margin:0 0 14px;color:var(--muted);line-height:1.5;font-size:14px}.wa{display:inline-flex;padding:13px 16px;border-radius:14px;background:#25d366;color:#072210;font-weight:950}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,var(--max));z-index:40;background:rgba(14,15,16,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.nav{text-align:center;font-size:11px;font-weight:900;color:#9ba0aa;padding:5px}.nav b{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:var(--primary)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:flex-end;justify-content:center}.overlay.open{display:flex}.sheet{width:min(100%,var(--max));max-height:92vh;overflow:auto;background:#111315;border-radius:24px 24px 0 0;border:1px solid rgba(255,255,255,.07);box-shadow:0 -24px 60px rgba(0,0,0,.45)}.drag{width:48px;height:5px;border-radius:99px;background:#4c5056;margin:9px auto 4px}.close{position:sticky;top:8px;float:right;margin:8px 12px 0 0;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#202329;color:#fff;z-index:4;font-size:18px}.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:8px 14px 0}.gallery::-webkit-scrollbar{display:none}.gallery img{width:88%;aspect-ratio:1/1;object-fit:cover;border-radius:20px;flex:0 0 88%;scroll-snap-align:center;background:#08090a}.detail{padding:16px}.dtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.dname{font-size:25px;line-height:1.08;font-weight:950;margin:0 0 6px}.dprice{font-size:22px;font-weight:950;white-space:nowrap}.ddesc{color:var(--muted);font-size:14px;line-height:1.55;margin:12px 0}.ratingbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#181b1e;border:1px solid var(--line);border-radius:16px;padding:12px;margin:14px 0}.score{font-size:26px;font-weight:950}.stars{color:var(--gold);letter-spacing:2px}.ratebtn{border:none;background:var(--primary);color:#fff;font-weight:950;padding:11px 13px;border-radius:13px}.reviewform{display:none;background:#181a1d;border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:14px}.reviewform.open{display:block}.starpick{display:flex;gap:7px;margin-bottom:10px}.starbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#22252a;color:#666;font-size:20px}.starbtn.sel{color:var(--gold);background:#2a2411}.reviewform input,.reviewform textarea{width:100%;border:1px solid var(--line);background:#0f1113;color:#fff;border-radius:12px;padding:11px;margin:6px 0}.reviewform textarea{min-height:80px;resize:vertical}.send{border:none;background:var(--primary);color:#fff;font-weight:950;padding:11px 14px;border-radius:12px;margin-top:6px}.reviews h4{font-size:16px;margin:14px 0 10px}.review{background:#15171a;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}.review .who{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:13px}.review p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.empty{padding:14px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
@media(max-width:380px){.title{font-size:27px}.thumb{width:102px;height:96px;flex-basis:102px}.highlights{grid-auto-columns:54%}}
</style>
</head>

  <main><section class="section" id="destaques"><div class="head"><h2>⭐ Destaques</h2><small>Toque para abrir</small></div><div class="highlights" id="highlights"></div></section><div id="sections"></div><section class="cta" id="contato"><div class="eyebrow">NFC Technology</div><h3>Gostou deste cardápio digital?</h3><p>Leve um cardápio NFC moderno e editável para o seu negócio.</p><a class="wa" href="https://wa.me/5551980539863?text=Ol%C3%A1!%20Gostei%20do%20NFC%20Card%C3%A1pios%20e%20quero%20o%20meu." target="_blank" rel="noopener">💬 Quero meu NFC Cardápios</a></section></main>

<nav class="bottom"><a class="nav active" href="#destaques"><b>🍽️</b>Cardápio</a><a class="nav" href="#tabs"><b>📋</b>Categorias</a><a class="nav" href="#contato"><b>💬</b>Contato</a></nav>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet"><div class="drag"></div><button class="close" id="close">✕</button><div class="gallery" id="gallery"></div><div class="detail"><div class="dtop"><div><h3 class="dname" id="dname"></h3><div class="rating"><span>★</span><b id="drating"></b><span id="dcount" style="color:#b8bbc3"></span></div></div><div class="dprice" id="dprice"></div></div><p class="ddesc" id="ddesc"></p><div class="ratingbox"><div><div class="score" id="score"></div><div class="stars" id="stars"></div><small id="counttext" style="color:#b8bbc3"></small></div><button class="ratebtn" id="ratebtn">Avaliar prato</button></div><div class="reviewform" id="reviewform"><div class="starpick" id="starpick"></div><input id="rname" placeholder="Seu nome (opcional)" maxlength="50" /><textarea id="rcomment" placeholder="Escreva um comentário (opcional)" maxlength="500"></textarea><button class="send" id="send">Enviar avaliação</button></div><div class="reviews"><h4>Comentários</h4><div id="reviews"></div></div></div></div></div>
<script>
const DATA={
highlights:['hot','temaki','combo','burger','coca'],
categories:[
{slug:'entradas',name:'Entradas / Petiscos'},{slug:'sushi',name:'Sushi / Combos'},{slug:'burgers',name:'Burgers'},{slug:'bebidas',name:'Bebidas'}],
dishes:[
{id:'ceviche',category:'entradas',name:'Ceviche Máfia (200g)',price:'R$ 39,99',description:'Delicioso e refrescante, nossa versão desse prato da culinária peruana é servida com cubos de peixe temperados, toque cítrico e finalização especial da casa.',images:['https://images.unsplash.com/photo-1559847844-5315695dadae?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1000&q=85'],rating:4.8,reviews:[{name:'Paula',stars:5,text:'Muito fresco e bem servido.'},{name:'André',stars:4,text:'Gostei bastante, bem equilibrado.'}]},
{id:'camarao',category:'entradas',name:'Camarão Grego 5 peças + Molho Rosé',price:'R$ 44,99',description:'Camarões grandes, recheados com catupiry cremoso, empanados e servidos com molho rosé.',images:['https://images.unsplash.com/photo-1565299585323-38174c4a6471?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1565557623262-b51c2513a641?auto=format&fit=crop&w=1000&q=85'],rating:4.9,reviews:[{name:'Julia',stars:5,text:'Crocante e muito saboroso.'}]},
{id:'tilapia',category:'entradas',name:'Tiras de Tilápia Empanada (300g)',price:'R$ 49,99',description:'Tiras de tilápia empanadas na panko, sequinhas e crocantes, acompanhadas de limão.',images:['https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1000&q=85'],rating:4.7,reviews:[]},
{id:'hot',category:'sushi',name:'Hot Tradicional 10 peças',price:'R$ 22,99',description:'Quentinho por fora, macio por dentro, com recheio clássico e acabamento crocante.',images:['https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=1000&q=85'],rating:4.6,reviews:[{name:'Marcos',stars:5,text:'Muito bom e bem sequinho.'}]},
{id:'temaki',category:'sushi',name:'Temaki Filadélfia',price:'R$ 25,99',description:'Temaki com salmão em cubos, cream cheese e cebolinha, montado na hora.',images:['https://images.unsplash.com/photo-1611143669185-af224c5e3252?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1562158074-d49fbeffcc91?auto=format&fit=crop&w=1000&q=85'],rating:4.8,reviews:[{name:'Bianca',stars:5,text:'Salmão muito fresco.'}]},
{id:'combo',category:'sushi',name:'Combo Família',price:'R$ 89,99',description:'Seleção especial com peças variadas para compartilhar. Ideal para 3 a 4 pessoas.',images:['https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1562802378-063ec186a863?auto=format&fit=crop&w=1000&q=85'],rating:4.9,reviews:[{name:'Bruna',stars:5,text:'Combo lindo e bem servido.'}]},
{id:'burger',category:'burgers',name:'Burguer Duplo Cheddar',price:'R$ 37,99',description:'Dois hambúrgueres artesanais, cheddar cremoso, bacon crocante e molho da casa.',images:['https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=1000&q=85'],rating:4.9,reviews:[{name:'Pedro',stars:5,text:'Carne no ponto e muito recheio.'}]},
{id:'coca',category:'bebidas',name:'Coca-Cola 2L',price:'R$ 15,00',description:'Refrigerante gelado para acompanhar.',images:['https://images.unsplash.com/photo-1629203851122-3726ecdf080e?auto=format&fit=crop&w=1000&q=85'],rating:4.5,reviews:[]}
]};
const byId=id=>DATA.dishes.find(d=>d.id===id);
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
const tabs=document.getElementById('tabs'), sections=document.getElementById('sections'), highlights=document.getElementById('highlights'), search=document.getElementById('search');
function renderTabs(){tabs.innerHTML=DATA.categories.map((c,i)=>`<a class="tab ${i===0?'active':''}" href="#${c.slug}">${c.name}</a>`).join('')}
function card(d,rank){return `<article class="hcard" onclick="openDish('${d.id}')"><img src="${d.images[0]}" alt="${d.name}">${rank?`<div class="rank">#${rank}</div>`:''}<div class="hcopy"><div class="hname">${d.name}</div><div class="price">${d.price}</div></div></article>`}
function renderHighlights(){highlights.innerHTML=DATA.highlights.map((id,i)=>card(byId(id),i+1)).join('')}
function row(d){return `<article class="item" onclick="openDish('${d.id}')" data-search="${(d.name+' '+d.description).toLowerCase()}"><div class="thumb"><img src="${d.images[0]}" alt="${d.name}"></div><div class="icopy"><div class="iname">${d.name}</div><div class="idesc">${d.description}</div><div class="meta"><div><div class="price">${d.price}</div><div class="rating"><span>★</span>${d.rating.toFixed(1)} • ${d.reviews.length} comentário${d.reviews.length===1?'':'s'}</div></div><span class="view">Ver prato</span></div></div></article>`}
function renderSections(q=''){q=q.toLowerCase().trim();sections.innerHTML=DATA.categories.map(c=>{const arr=DATA.dishes.filter(d=>d.category===c.slug && (!q||(d.name+' '+d.description+' '+c.name).toLowerCase().includes(q)));return `<section class="section" id="${c.slug}"><div class="head"><h2>${c.name}</h2><small>Toque em um prato</small></div>${arr.length?`<div class="list">${arr.map(row).join('')}</div>`:'<div class="empty">Nenhum prato encontrado.</div>'}</section>`}).join('')}
search.addEventListener('input',e=>renderSections(e.target.value));
const overlay=document.getElementById('overlay'), gallery=document.getElementById('gallery'), close=document.getElementById('close'), dname=document.getElementById('dname'), dprice=document.getElementById('dprice'), ddesc=document.getElementById('ddesc'), drating=document.getElementById('drating'), dcount=document.getElementById('dcount'), score=document.getElementById('score'), starstxt=document.getElementById('stars'), counttext=document.getElementById('counttext'), reviews=document.getElementById('reviews'), ratebtn=document.getElementById('ratebtn'), reviewform=document.getElementById('reviewform'), starpick=document.getElementById('starpick'), send=document.getElementById('send');let current=null,selected=5;
function openDish(id){current=byId(id);gallery.innerHTML=current.images.map((src,i)=>`<img src="${src}" alt="${current.name} foto ${i+1}">`).join('');dname.textContent=current.name;dprice.textContent=current.price;ddesc.textContent=current.description;drating.textContent=current.rating.toFixed(1);dcount.textContent=`• ${current.reviews.length} comentários`;score.textContent=current.rating.toFixed(1);starstxt.textContent=stars(current.rating);counttext.textContent=`${current.reviews.length} comentário${current.reviews.length===1?'':'s'}`;renderReviews();renderStarPick();reviewform.classList.remove('open');overlay.classList.add('open');document.body.style.overflow='hidden'}
function renderReviews(){reviews.innerHTML=current.reviews.length?current.reviews.map(r=>`<div class="review"><div class="who"><span>${r.name||'Cliente'}</span><span style="color:#ffd54a">${'★'.repeat(r.stars)}</span></div><p>${r.text||'Avaliação sem comentário.'}</p></div>`).join(''):'<div class="empty">Ainda não há comentários. Seja o primeiro a avaliar.</div>'}
function renderStarPick(){starpick.innerHTML=[1,2,3,4,5].map(n=>`<button class="starbtn ${n<=selected?'sel':''}" onclick="pickStar(${n})">★</button>`).join('')}
function pickStar(n){selected=n;renderStarPick()}window.pickStar=pickStar;ratebtn.onclick=()=>reviewform.classList.toggle('open');send.onclick=()=>{alert('Avaliação registrada nesta versão de apresentação. Na versão com painel, ela ficará salva no banco do restaurante.');reviewform.classList.remove('open')};close.onclick=()=>{overlay.classList.remove('open');document.body.style.overflow=''};overlay.addEventListener('click',e=>{if(e.target===overlay)close.click()});window.openDish=openDish;
renderTabs();renderHighlights();renderSections();
</script>
